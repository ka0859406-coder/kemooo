<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DONIA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{height:100vh;overflow:hidden;font-family:'Cairo',sans-serif;display:flex;justify-content:center;align-items:center;background:#000}
  .bg{position:fixed;inset:0;background:url('dodo.jpeg') center/cover no-repeat;filter:blur(25px) brightness(0.6) saturate(1.3);transform:scale(1.1);z-index:0}
  .overlay{position:fixed;inset:0;background:linear-gradient(180deg,rgba(168,85,247,0.3),rgba(236,72,153,0.4));z-index:1}
  #hearts{position:fixed;inset:0;pointer-events:none;z-index:2}
  #hearts span{position:absolute;top:-20px;animation:fall 7s linear infinite}
  @keyframes fall{to{transform:translateY(110vh)}}

  .card{position:relative;z-index:3;width:90%;max-width:360px;height:92vh;max-height:760px;background:rgba(255,255,255,0.12);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.25);border-radius:35px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.3);display:flex;flex-direction:column}

  .img-wrap{padding:18px 18px 0 18px;flex-shrink:0}
  .img-inner{width:100%;height:400px;border-radius:25px;overflow:hidden;position:relative;box-shadow:0 15px 35px rgba(0,0,0,0.3)}
  .img-inner img{width:100%;height:100%;object-fit:cover;object-position:top center}
  .img-inner::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:50%;background:linear-gradient(to top,rgba(0,0,0,0.6),transparent)}
  .name-on-img{position:absolute;bottom:16px;right:18px;left:18px;display:flex;justify-content:space-between;align-items:end;z-index:2}
  .name-on-img h2{font-family:'Great Vibes',cursive;font-size:38px;color:white;text-shadow:0 2px 15px rgba(0,0,0,0.8)}
  .music-icon{width:44px;height:44px;background:rgba(255,255,255,0.95);border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:18px;box-shadow:0 5px 15px rgba(0,0,0,0.3);cursor:pointer}
  .music-icon.playing{animation:spin 2s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* الحل هنا */
  .text{padding:20px 22px 24px;text-align:center;color:white;overflow-y:auto;flex:1}
  .text::-webkit-scrollbar{width:3px}
  .text::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.3);border-radius:10px}
  .text h1{font-size:28px;font-weight:800;margin-bottom:4px;text-shadow:0 2px 10px rgba(0,0,0,0.3)}
  .text .sub{font-size:13px;font-weight:600;letter-spacing:1px;opacity:0.9;margin-bottom:16px}
  .text p{font-size:15px;line-height:2.2;font-weight:600;opacity:1;white-space:pre-line}
  .text p b{font-weight:800;color:#ffd1f5}
  .divider{width:40px;height:2px;background:rgba(255,255,255,0.5);margin:14px auto;border-radius:10px}
  .footer{margin-top:18px;display:flex;justify-content:center;gap:10px;align-items:center;opacity:0.8;font-size:10px;letter-spacing:2px;font-weight:700}
  .bar{width:28px;height:2px;background:white;border-radius:10px;opacity:0.6}
</style>
</head>
<body>

<div class="bg"></div>
<div class="overlay"></div>
<div id="hearts"></div>

<div class="card" id="card">
  <div class="img-wrap">
    <div class="img-inner">
      <img src="dodo.jpeg" alt="Donia">
      <div class="name-on-img">
        <h2>Donia</h2>
        <div class="music-icon" id="playBtn">🎵</div>
      </div>
    </div>
  </div>

  <div class="text">
    <h1>دُنيا</h1>
    <div class="sub">حبيبتي و صاحبتي الجدعة</div>
    
    <p>إنتي اللي لما احتاج حضن
بلاقيكي حبيبتي و لما
احتاج سند بلاقيكي أجدع صحبة</p>

    <div class="divider"></div>

    <p><b>معاكي بحس إني مش لوحدي أبداً</b>
بتحبيني و بتخافي عليا زي أختي</p>

    <p style="margin-top:12px;font-size:14px;opacity:0.9">
      إنتي الحب و الصاحبة الحلوة
      اللي اتجمعوا في قلب واحد
    </p>

    <div class="footer">
      <div class="bar"></div>
      KEMO ∞ DONIA
      <div class="bar"></div>
    </div>
    <div style="height:8px"></div>
  </div>
</div>

<audio id="mySong" loop preload="auto">
  <source src="sonng.mp3" type="audio/mpeg">
</audio>

<script>
  const song=document.getElementById('mySong');
  const btn=document.getElementById('playBtn');
  const card=document.getElementById('card');
  let isPlaying=false;
  function togglePlay(){
    if(!isPlaying){song.volume=0.9;song.play();btn.innerHTML='⏸️';btn.classList.add('playing');isPlaying=true}
    else{song.pause();btn.innerHTML='🎵';btn.classList.remove('playing');isPlaying=false}
  }
  btn.addEventListener('click',e=>{e.stopPropagation();togglePlay()});
  card.addEventListener('click',()=>{if(!isPlaying)togglePlay()});
  const c=document.getElementById('hearts');
  for(let i=0;i<20;i++){let sp=document.createElement('span');sp.innerHTML='💜';sp.style.left=Math.random()*100+'vw';sp.style.animationDelay=Math.random()*6+'s';sp.style.fontSize=(10+Math.random()*16)+'px';c.appendChild(sp);}
</script>

</body>
</html>
